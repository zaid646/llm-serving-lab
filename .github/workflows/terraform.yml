name: Terraform platform validation

on:
  push:
    branches: [main, feature/terraform-platform]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: 1.17.0
  LOCALSTACK_IMAGE: localstack/localstack:3.4.0
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_DEFAULT_REGION: us-east-1
  TF_VAR_aws_access_key_id: test
  TF_VAR_aws_secret_access_key: test
  TF_VAR_aws_region: us-east-1
  TF_VAR_aws_endpoint: http://localstack:4566

jobs:
  validate:
    name: fmt + validate + tflint + checkov
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - modules/s3
          - modules/iam
          - modules/vpc
          - modules/eks
          - modules/rds
          - envs/dev
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: terraform fmt -check -recursive
        working-directory: ${{ matrix.target }}
        run: terraform fmt -check -recursive

      - name: terraform init -backend=false
        working-directory: ${{ matrix.target }}
        run: terraform init -backend=false

      - name: terraform validate
        working-directory: ${{ matrix.target }}
        run: terraform validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v3

      - name: tflint --enable-plugin=aws
        working-directory: ${{ matrix.target }}
        run: tflint --init --enable-plugin=aws && tflint

      - name: Setup Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: ${{ matrix.target }}
          framework: terraform
          soft_fail: false
          output: cli,json,sarif
          output_path: ./checkov-${{ matrix.target | replace('/', '-') }}.json

      - name: Commit checkov results
        if: always()
        run: |
          mkdir -p terraform/security-reports
          cp checkov-${{ matrix.target | replace('/', '-') }}.json terraform/security-reports/checkov-${{ matrix.target | replace('/', '-') }}.json 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkov-reports-${{ matrix.target | replace('/', '-') }}
          path: terraform/security-reports/
          retention-days: 7

  plan-localstack:
    name: LocalStack plan gate
    needs: validate
    runs-on: ubuntu-latest
    services:
      localstack:
        image: ${{ env.LOCALSTACK_IMAGE }}
        ports:
          - 4566:4566
        env:
          SERVICES: s3,iam,ec2,eks,rds
          DEFAULT_REGION: us-east-1
        options: >-
          --health-cmd "curl -f http://localhost:4566/_localstack/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: terraform init (LocalStack backend)
        working-directory: terraform/envs/dev
        run: |
          terraform init -backend=false
          TF_VAR_aws_endpoint=http://localstack:4566 \
          terraform init

      - name: terraform plan (LocalStack)
        id: plan
        working-directory: terraform/envs/dev
        run: |
          TF_VAR_aws_endpoint=http://localstack:4566 \
          terraform plan -out=plan.tfplan
          terraform show -json plan.tfplan > plan.json
          echo "changes=$(terraform show -json plan.tfplan | jq '[.resource_changes[] | select(.change.actions[] != "no-op")] | length')" >> $GITHUB_OUTPUT

      - name: fail on plan error
        if: failure()
        run: exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: localstack-plan
          path: |
            terraform/envs/dev/plan.tfplan
            terraform/envs/dev/plan.json
          retention-days: 7

  security-report:
    name: Commit checkov security report
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: terraform/security-reports
          merge-multiple: true

      - name: Aggregate checkov report
        run: |
          if ls terraform/security-reports/*.json >/dev/null 2>&1; then
            jq -s 'add' terraform/security-reports/*.json > terraform/security-report.txt 2>/dev/null || \
            cat terraform/security-reports/*.json > terraform/security-report.txt
          else
            echo "No checkov findings" > terraform/security-report.txt
          fi
          wc -l terraform/security-report.txt

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: docs: update Terraform checkov security report
          file_pattern: terraform/security-report.txt
